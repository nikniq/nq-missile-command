<!DOCTYPE html>
<html>
<head>
  <title>NQ Missile Command</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: black;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  canvas {
    cursor: crosshair;
    border: 1px solid #444;
    max-width: 100%;
    max-height: 100vh;
  }
  </style>

        <!-- Google tag (gtag.js) -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-34RWEG01MV"></script>
        <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-34RWEG01MV');
        </script>
        <!-- End Google Analytics -->


</head>
<body>
<canvas width="800" height="550" id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const context = canvas.getContext('2d');
const groundY = 500;  // y position of where the ground starts
const cityWidth = 45;  // how wide a city rect is
const cityHeight = 25;  // how tall a city rect is
const cityY = groundY - cityHeight;  // y position of the city
const siloY = groundY - 30;  // y position of the top of the silo
const missileSize = 4;  // the radius/size of a missile

const siloSpeeds = [ 9, 18, 9 ];  // counter-missile speed per silo (center is fastest)
const maxExplosionSize = 30;

// scoring
const missileScore = 25;      // points per enemy missile destroyed
const smartScore = 125;       // points per smart bomb destroyed
const bomberScore = 100;      // points per bomber shot down
const cityBonus = 100;        // wave-end bonus per surviving city
const ammoBonus = 5;          // wave-end bonus per unused counter-missile
const bonusCityEvery = 5000;  // rebuild a city every time this many points is reached

// game state: 'ready' | 'playing' | 'wave-end' | 'game-over'
let state = 'ready';
let stateTime = 0;            // timestamp of the last state change
let score = 0;
let waveBonus = 0;
let level = 1;
let highScore = 0;
try { highScore = +localStorage.getItem('nq-mc-highscore') || 0; } catch (e) {}

let missiles = [];
let counterMissiles = [];
let explosions = [];
let popups = [];              // floating score texts
let bombers = [];

let paused = false;
let muted = false;
let pauseStart = 0;
let shake = 0;                // screen shake intensity
let flash = 0;                // white flash frames when a building dies
let debris = [];              // building debris particles
let fadingTrails = [];        // missile trails fading out after death
let mouse = { x: canvas.width / 2, y: 250 };  // for keyboard-fired silos
let nextCityScore = bonusCityEvery;
let bonusCitiesEarned = 0;    // dead cities waiting to be rebuilt at wave end
let rebuiltCity = false;      // show the rebuild message on the wave-end screen

// per-wave spawn bookkeeping
let missilesToSpawn = 0;
let bombersToSpawn = 0;
let lastSpawnTime = 0;
let lastBomberTime = 0;

const cityPos = [ 140, 220, 300, 500, 580, 660 ];
let cities = [];

// the x position of each of the 3 silos
const siloPos = [ 55, canvas.width / 2, 745 ];
let silos = [];

// the x position of each missile spawn point. missiles spawn
// directly above each city and silo plus the two edges
const missileSpawns = cityPos.concat(siloPos).concat([ 0, canvas.width ]);

// pre-generated star field for the background
const stars = [];
for (let i = 0; i < 80; i++) {
  stars.push({
    x: Math.random() * canvas.width,
    y: Math.random() * (groundY - 40),
    r: Math.random() * 1.3 + 0.3
  });
}

// tiny sound effects with the web audio api. created lazily on the
// first click because browsers block audio before a user gesture
let audioCtx = null;
function sound(freq, endFreq, duration, type, volume) {
  if (!audioCtx || muted) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const now = audioCtx.currentTime;
  osc.type = type;
  osc.frequency.setValueAtTime(freq, now);
  osc.frequency.exponentialRampToValueAtTime(endFreq, now + duration);
  gain.gain.setValueAtTime(volume, now);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + duration);
}
const launchSound = () => sound(600, 150, 0.25, 'square', 0.06);
const boomSound = () => sound(120, 30, 0.4, 'sawtooth', 0.12);
const loseSound = () => sound(300, 40, 1.2, 'sawtooth', 0.15);

// return a random integer between min (inclusive) and max (inclusive)
// @see https://stackoverflow.com/a/1527820/2124254
function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

// get the angle between two points
function angleBetweenPoints(source, target) {

  // atan2 returns the counter-clockwise angle in respect to the
  // x-axis, but the canvas rotation system is based on the y-axis
  // (rotation of 0 = up).
  // so we need to add a quarter rotation to return a
  // counter-clockwise rotation in respect to the y-axis
  return Math.atan2(target.y - source.y, target.x - source.x) + Math.PI / 2;
}

// distance between two points
function distance(source, target) {
  return Math.hypot(source.x - target.x, source.y - target.y);
}

// enemy missiles get faster and more numerous each level
function missileSpeed() {
  return Math.min(0.8 + level * 0.15, 3);
}
function missilesThisLevel() {
  return 8 + level * 3;
}

function addExplosion(x, y) {
  explosions.push({ x, y, size: 2, dir: 1, alive: true });
  boomSound();
}

function addPopup(x, y, text) {
  popups.push({ x, y, text, life: 60 });
}

// a building blowing up: screen shake, white flash, and debris
function destroyBuilding(building) {
  building.alive = false;
  shake = 14;
  flash = 5;
  for (let i = 0; i < 18; i++) {
    debris.push({
      x: building.x + randInt(-15, 15),
      y: building.y,
      dx: (Math.random() - 0.5) * 4,
      dy: -Math.random() * 4 - 1,
      color: ['#08f', '#9df', '#dbb020', '#f80'][randInt(0, 3)],
      life: randInt(30, 60)
    });
  }
}

// keep a missile's trail on screen briefly after it dies
function addFadingTrail(missile, rgb) {
  fadingTrails.push({
    x1: missile.smart ? missile.pos.x - missile.dx * 12 : missile.start.x,
    y1: missile.smart ? missile.pos.y - missile.dy * 12 : missile.start.y,
    x2: missile.pos.x,
    y2: missile.pos.y,
    rgb,
    life: 30
  });
}

// spawn a missile from a random spawn point aimed at a random living
// city or silo. the target position is copied so the missile keeps
// flying at the same spot even if its target is destroyed first
function spawnMissile(startX, startY) {
  const targets = cities.concat(silos).filter(t => t.alive);
  if (!targets.length) return;

  const start = {
    x: startX !== undefined ? startX : missileSpawns[randInt(0, missileSpawns.length - 1)],
    y: startY !== undefined ? startY : 0
  };
  const targetObj = targets[randInt(0, targets.length - 1)];
  const target = { x: targetObj.x, y: targetObj.y };
  const angle = angleBetweenPoints(start, target);

  // from level 5 on some missiles are smart bombs that swerve to
  // dodge explosions. they are worth more and never split
  const smart = level >= 5 && startY === undefined && Math.random() < 0.15;
  const speed = missileSpeed() * (smart ? 0.85 : 1);

  missiles.push({
    start,
    target,
    targetObj,
    pos: { x: start.x, y: start.y },
    alive: true,
    smart,
    speed,

    // from level 4 on some missiles split into more warheads mid-flight
    splitAt: (level >= 4 && !smart && startY === undefined && Math.random() < 0.25)
      ? randInt(100, 250)
      : null,

    dx: speed * Math.sin(angle),
    dy: speed * -Math.cos(angle)
  });
}

function startWave() {
  state = 'playing';
  missilesToSpawn = missilesThisLevel();
  bombersToSpawn = level >= 3 ? Math.min(1 + Math.floor((level - 3) / 2), 4) : 0;
  lastSpawnTime = -Infinity;
  lastBomberTime = 0;
  waveBonus = 0;

  // silos restock and rebuild each wave, destroyed cities stay dead
  // (unless a bonus city was earned)
  silos = siloPos.map((x, i) => ({ x, y: siloY, missiles: 10, speed: siloSpeeds[i], alive: true }));
}

function resetGame() {
  score = 0;
  level = 1;
  missiles = [];
  counterMissiles = [];
  explosions = [];
  popups = [];
  bombers = [];
  debris = [];
  fadingTrails = [];
  shake = 0;
  flash = 0;
  nextCityScore = bonusCityEvery;
  bonusCitiesEarned = 0;
  cities = cityPos.map(x => ({ x, y: cityY, alive: true }));
  startWave();
}

// bank a bonus city every time the score passes another threshold
function checkBonusCity() {
  while (score >= nextCityScore) {
    nextCityScore += bonusCityEvery;
    bonusCitiesEarned++;
  }
}

function saveHighScore() {
  if (score > highScore) {
    highScore = score;
    try { localStorage.setItem('nq-mc-highscore', highScore); } catch (e) {}
  }
}

// draw a city as a little skyline of buildings
function drawCity(city) {
  const left = city.x - cityWidth / 2;
  context.fillStyle = '#08f';
  context.fillRect(left, city.y + 10, cityWidth, cityHeight - 10);
  context.fillRect(left + 4, city.y + 4, 9, cityHeight - 4);
  context.fillRect(left + 18, city.y, 10, cityHeight);
  context.fillRect(left + 33, city.y + 6, 8, cityHeight - 6);

  // windows
  context.fillStyle = '#9df';
  for (let wx = left + 6; wx < left + cityWidth - 4; wx += 8) {
    context.fillRect(wx, city.y + 14, 3, 3);
    context.fillRect(wx, city.y + 20, 3, 3);
  }
}

function drawCenteredText(text, y, size, color) {
  context.fillStyle = color;
  context.font = 'bold ' + size + 'px monospace';
  context.textAlign = 'center';
  context.fillText(text, canvas.width / 2, y);
}

// game loop
function loop(time) {
  requestAnimationFrame(loop);

  // while paused, leave the last frame on screen untouched
  if (paused) return;

  context.clearRect(0, 0, canvas.width, canvas.height);

  // shake the whole scene when a building was just destroyed
  context.save();
  if (shake > 0) {
    context.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    shake = Math.max(0, shake - 0.5);
  }

  // stars
  context.fillStyle = '#556';
  stars.forEach(star => {
    context.fillRect(star.x, star.y, star.r, star.r);
  });

  // spawn missiles in small clusters every few seconds until the
  // wave's quota is used up. clusters get bigger on later levels
  if (state === 'playing' && missilesToSpawn > 0 && time - lastSpawnTime > 3000) {
    const cluster = Math.min(missilesToSpawn, randInt(2, 2 + Math.ceil(level / 2)));
    for (let i = 0; i < cluster; i++) {
      spawnMissile();
    }
    missilesToSpawn -= cluster;
    lastSpawnTime = time;
  }

  // send in a bomber every so often on later waves
  if (state === 'playing' && bombersToSpawn > 0 && time - lastBomberTime > 6000) {
    const fromLeft = Math.random() < 0.5;
    bombers.push({
      x: fromLeft ? -30 : canvas.width + 30,
      y: randInt(80, 180),
      dx: (fromLeft ? 1 : -1) * (0.7 + level * 0.05),
      nextDrop: time + randInt(1000, 2500),
      alive: true
    });
    bombersToSpawn--;
    lastBomberTime = time;
  }

  // draw cities (dead ones leave a rubble mound)
  cities.forEach(city => {
    if (city.alive) {
      drawCity(city);
    }
    else {
      context.fillStyle = '#642';
      context.fillRect(city.x - cityWidth / 2, groundY - 6, cityWidth, 6);
    }
  });

  // draw ground and silos
  context.fillStyle = '#dbb020';
  context.beginPath();
  context.moveTo(0, canvas.height);
  context.lineTo(0, groundY);

  // draw each silo hill
  siloPos.forEach(x => {
    context.lineTo(x - 40, groundY);
    context.lineTo(x - 20, siloY);
    context.lineTo(x + 20, siloY);
    context.lineTo(x + 40, groundY);
  });

  context.lineTo(canvas.width, groundY);
  context.lineTo(canvas.width, canvas.height);
  context.fill();

  // draw the number of counter-missiles each silo
  context.fillStyle = 'black';
  silos.forEach(silo => {
    if (!silo.alive) return;

    // draw missiles in a triangular shape by incrementing how many
    // missiles we can draw per row
    let missilesPerRow = 1;
    let count = 0;
    let x = silo.x;
    let y = silo.y + 5;

    for (let i = 0; i < silo.missiles; i++) {
      context.fillRect(x, y, 4, 10);
      x += 12;

      if (++count === missilesPerRow) {
        x = silo.x - 6 * count;
        missilesPerRow++;
        y += 7;
        count = 0;
      }
    }

    if (silo.missiles === 0) {
      context.font = 'bold 11px monospace';
      context.textAlign = 'center';
      context.fillText('OUT', silo.x, silo.y + 18);
    }
  });

  // update and draw bombers
  bombers.forEach(bomber => {
    bomber.x += bomber.dx;

    // drop a missile every couple of seconds while over the screen
    if (time > bomber.nextDrop && bomber.x > 40 && bomber.x < canvas.width - 40) {
      bomber.nextDrop = time + randInt(1500, 3000);
      spawnMissile(bomber.x, bomber.y + 8);
    }

    // bombers die to explosions like missiles do
    explosions.forEach(explosion => {
      if (bomber.alive && distance(explosion, bomber) < 12 + explosion.size) {
        bomber.alive = false;
        score += bomberScore * level;
        addPopup(bomber.x, bomber.y, '+' + bomberScore * level);
        addExplosion(bomber.x, bomber.y);
      }
    });

    // remove once fully off screen
    if (bomber.x < -50 || bomber.x > canvas.width + 50) {
      bomber.alive = false;
    }

    if (bomber.alive) {
      context.fillStyle = '#3d5';
      context.fillRect(bomber.x - 14, bomber.y - 3, 28, 6);   // fuselage
      context.fillRect(bomber.x - 4, bomber.y - 8, 8, 5);     // canopy
      const tailX = bomber.dx > 0 ? bomber.x - 14 : bomber.x + 10;
      context.fillRect(tailX, bomber.y - 9, 4, 6);            // tail
    }
  });

  // update and draw missiles
  context.strokeStyle = 'red';
  context.lineWidth = 2;

  // update color based on time so it "blinks"
  context.fillStyle = Math.round(time / 2) % 2 === 0 ? 'white' : 'yellow';

  missiles.forEach(missile => {

    // smart bombs steer toward their target but swerve away from
    // nearby explosions
    if (missile.smart) {
      const angle = angleBetweenPoints(missile.pos, missile.target);
      let dx = missile.speed * Math.sin(angle);
      let dy = missile.speed * -Math.cos(angle);

      explosions.forEach(explosion => {
        const dist = distance(explosion, missile.pos);
        if (dist < 90 && dist > 0) {
          const push = (90 - dist) / 90 * missile.speed * 2.5;
          dx += (missile.pos.x - explosion.x) / dist * push;
          dy += (missile.pos.y - explosion.y) / dist * push;
        }
      });

      // renormalize so dodging doesn't change the speed, and never
      // let a smart bomb fly back up off the screen
      const mag = Math.hypot(dx, dy);
      missile.dx = dx / mag * missile.speed;
      missile.dy = Math.max(dy / mag * missile.speed, missile.speed * 0.2);
    }

    missile.pos.x += missile.dx;
    missile.pos.y += missile.dy;

    // split into extra warheads mid-flight
    if (missile.splitAt !== null && missile.pos.y >= missile.splitAt) {
      missile.splitAt = null;
      const splits = randInt(1, 2);
      for (let i = 0; i < splits; i++) {
        spawnMissile(missile.pos.x, missile.pos.y);
      }
    }

    // check if the missile hit an explosion by doing a circle-circle
    // collision check
    explosions.forEach(explosion => {
      const dist = distance(explosion, missile.pos);
      if (dist < missileSize + explosion.size && missile.alive) {
        missile.alive = false;
        const points = (missile.smart ? smartScore : missileScore) * level;
        score += points;
        checkBonusCity();
        addPopup(missile.pos.x, missile.pos.y, '+' + points);
      }
    });

    // if missile is close to the target we blow it up
    const dist = distance(missile.pos, missile.target);
    if (dist < Math.max(missile.speed, 2)) {
      missile.alive = false;
      if (missile.targetObj.alive) {
        destroyBuilding(missile.targetObj);
      }
    }

    if (missile.alive) {
      if (missile.smart) {

        // smart bombs curve, so only a short trail behind the head
        context.strokeStyle = '#3d5';
        context.beginPath();
        context.moveTo(missile.pos.x - missile.dx * 12, missile.pos.y - missile.dy * 12);
        context.lineTo(missile.pos.x, missile.pos.y);
        context.stroke();

        // blinking green diamond
        context.fillStyle = Math.round(time / 2) % 2 === 0 ? '#3d5' : 'white';
        context.beginPath();
        context.moveTo(missile.pos.x, missile.pos.y - 5);
        context.lineTo(missile.pos.x + 5, missile.pos.y);
        context.lineTo(missile.pos.x, missile.pos.y + 5);
        context.lineTo(missile.pos.x - 5, missile.pos.y);
        context.fill();
        context.strokeStyle = 'red';
      }
      else {
        context.beginPath();
        context.moveTo(missile.start.x, missile.start.y);
        context.lineTo(missile.pos.x, missile.pos.y);
        context.stroke();

        // center the head of the missile to the x/y position
        context.fillStyle = Math.round(time / 2) % 2 === 0 ? 'white' : 'yellow';
        context.fillRect(missile.pos.x - missileSize / 2, missile.pos.y - missileSize / 2, missileSize, missileSize);
      }
    }
    // a dead missile spawns an explosion and its trail fades out
    else {
      addFadingTrail(missile, missile.smart ? '51,221,85' : '255,68,68');
      addExplosion(missile.pos.x, missile.pos.y);
    }
  });

  // update and draw counter missiles
  context.strokeStyle = '#4af';
  context.fillStyle = 'white';
  counterMissiles.forEach(missile => {
    missile.pos.x += missile.dx;
    missile.pos.y += missile.dy;

    // if missile is close to the target we blow it up exactly at the
    // point that was clicked (instead of up to a full step early)
    const dist = distance(missile.pos, missile.target);
    if (dist < missile.speed) {
      missile.alive = false;
      addFadingTrail(missile, '68,170,255');
      addExplosion(missile.target.x, missile.target.y);
    }
    else {
      context.beginPath();
      context.moveTo(missile.start.x, missile.start.y);
      context.lineTo(missile.pos.x, missile.pos.y);
      context.stroke();

      context.fillRect(missile.pos.x - 2, missile.pos.y - 2, 4, 4);

      // draw an x where the counter-missile is headed
      context.strokeStyle = '#4af';
      context.lineWidth = 1;
      context.beginPath();
      context.moveTo(missile.target.x - 4, missile.target.y - 4);
      context.lineTo(missile.target.x + 4, missile.target.y + 4);
      context.moveTo(missile.target.x + 4, missile.target.y - 4);
      context.lineTo(missile.target.x - 4, missile.target.y + 4);
      context.stroke();
      context.lineWidth = 2;
    }
  });

  // draw fading trails of dead missiles
  context.lineWidth = 2;
  fadingTrails.forEach(trail => {
    trail.life--;
    context.strokeStyle = 'rgba(' + trail.rgb + ',' + (trail.life / 30) + ')';
    context.beginPath();
    context.moveTo(trail.x1, trail.y1);
    context.lineTo(trail.x2, trail.y2);
    context.stroke();
  });

  // update and draw building debris
  debris.forEach(piece => {
    piece.x += piece.dx;
    piece.y += piece.dy;
    piece.dy += 0.15;  // gravity
    piece.life--;
    if (piece.y > groundY) piece.life = 0;
    context.fillStyle = piece.color;
    context.fillRect(piece.x, piece.y, 3, 3);
  });

  // update and draw explosions
  explosions.forEach(explosion => {
    explosion.size += 0.35 * explosion.dir;

    // change the direction of the explosion to wane
    if (explosion.size > maxExplosionSize) {
      explosion.dir = -1;
    }

    // remove the explosion
    if (explosion.size <= 0) {
      explosion.alive = false;
    }
    else {

      // explosions near the ground take out cities and silos too
      cities.concat(silos).forEach(building => {
        if (building.alive && distance(explosion, building) < explosion.size + 10) {
          destroyBuilding(building);
        }
      });

      const colors = ['#fff', '#ff4', '#f80', '#f44'];
      context.fillStyle = colors[Math.round(time / 60) % colors.length];
      context.beginPath();
      context.arc(explosion.x, explosion.y, explosion.size, 0, 2 * Math.PI);
      context.fill();
    }
  });

  // draw floating score popups
  context.font = 'bold 12px monospace';
  context.textAlign = 'center';
  popups.forEach(popup => {
    popup.life--;
    popup.y -= 0.4;
    context.fillStyle = 'rgba(255,255,150,' + (popup.life / 60) + ')';
    context.fillText(popup.text, popup.x, popup.y);
  });

  // remove dead missiles, explosions, and bombers. dead cities stay
  // in the array so bonus cities can rebuild them
  missiles = missiles.filter(missile => missile.alive);
  counterMissiles = counterMissiles.filter(missile => missile.alive);
  explosions = explosions.filter(explosion => explosion.alive);
  bombers = bombers.filter(bomber => bomber.alive);
  popups = popups.filter(popup => popup.life > 0);
  fadingTrails = fadingTrails.filter(trail => trail.life > 0);
  debris = debris.filter(piece => piece.life > 0);

  // HUD
  context.textAlign = 'left';
  context.font = 'bold 16px monospace';
  context.fillStyle = 'white';
  context.fillText('SCORE ' + score, 10, 24);
  context.textAlign = 'right';
  context.fillText('HIGH ' + Math.max(highScore, score), canvas.width - 10, 24);
  drawCenteredText('WAVE ' + level, 24, 16, 'white');

  // state transitions
  const aliveCities = cities.filter(city => city.alive).length;
  const quiet = missilesToSpawn === 0 && bombersToSpawn === 0 &&
    !missiles.length && !explosions.length && !bombers.length;

  if (state === 'playing') {
    if (!aliveCities && !bonusCitiesEarned) {

      // let the last explosions finish before ending the game
      if (!missiles.length && !explosions.length) {
        state = 'game-over';
        stateTime = time;
        saveHighScore();
        loseSound();
      }
    }
    else if (quiet) {
      state = 'wave-end';
      stateTime = time;

      // tally the wave bonus
      const ammoLeft = silos.reduce((sum, silo) => sum + (silo.alive ? silo.missiles : 0), 0);
      waveBonus = aliveCities * cityBonus + ammoLeft * ammoBonus;
      score += waveBonus;
      checkBonusCity();

      // spend banked bonus cities on rebuilding dead ones
      while (bonusCitiesEarned > 0) {
        const dead = cities.filter(city => !city.alive);
        if (!dead.length) break;
        dead[randInt(0, dead.length - 1)].alive = true;
        bonusCitiesEarned--;
        rebuiltCity = true;
      }
      saveHighScore();
    }
  }
  else if (state === 'wave-end') {
    drawCenteredText('WAVE ' + level + ' CLEAR', 220, 32, '#ff4');
    drawCenteredText('CITY BONUS + AMMO BONUS: ' + waveBonus, 260, 18, 'white');
    if (rebuiltCity) {
      drawCenteredText('BONUS CITY REBUILT!', 292, 18, '#3d5');
    }
    drawCenteredText('get ready...', 324, 16, '#aaa');

    if (time - stateTime > 3000) {
      rebuiltCity = false;
      level++;
      startWave();
    }
  }
  else if (state === 'game-over') {
    drawCenteredText('THE END', 220, 48, '#f44');
    drawCenteredText('FINAL SCORE: ' + score, 270, 22, 'white');
    if (score >= highScore && score > 0) {
      drawCenteredText('NEW HIGH SCORE!', 300, 18, '#ff4');
    }
    if (time - stateTime > 1500) {
      drawCenteredText('click to play again', 340, 16, '#aaa');
    }
  }
  else if (state === 'ready') {
    drawCenteredText('MISSILE COMMAND', 200, 40, 'white');
    drawCenteredText('defend your cities', 240, 18, '#aaa');
    drawCenteredText('click to fire from the nearest silo', 270, 16, '#aaa');
    drawCenteredText('or press 1/2/3 to pick a silo - the center one is fastest', 294, 14, '#aaa');
    drawCenteredText('bonus city every ' + bonusCityEvery + ' points - beware green smart bombs', 316, 14, '#aaa');
    drawCenteredText('P pauses, M mutes', 338, 14, '#aaa');
    drawCenteredText('click to start', 380, 20, '#ff4');
  }

  if (muted) {
    context.textAlign = 'right';
    context.font = 'bold 12px monospace';
    context.fillStyle = '#888';
    context.fillText('MUTED', canvas.width - 10, 42);
  }

  // silo key labels
  if (state === 'playing') {
    context.font = 'bold 11px monospace';
    context.textAlign = 'center';
    context.fillStyle = '#975';
    silos.forEach((silo, i) => {
      context.fillText(String(i + 1), silo.x, groundY + 14);
    });
  }

  context.restore();

  // white flash when a building is destroyed (drawn unshaken, on top)
  if (flash > 0) {
    context.fillStyle = 'rgba(255,255,255,' + (flash / 12) + ')';
    context.fillRect(0, 0, canvas.width, canvas.height);
    flash--;
  }
}

// fire a counter-missile from a specific silo at a point
function fireCounterMissile(silo, x, y) {
  if (!silo || !silo.alive || !silo.missiles) return;

  const start = { x: silo.x, y: silo.y };
  const target = { x, y: Math.min(y, siloY - 10) };
  const angle = angleBetweenPoints(start, target);
  silo.missiles--;
  launchSound();
  counterMissiles.push({
    start,
    target,
    pos: { x: silo.x, y: silo.y },
    speed: silo.speed,
    dx: silo.speed * Math.sin(angle),
    dy: silo.speed * -Math.cos(angle),
    alive: true
  });
}

// convert a mouse event to canvas coordinates, accounting for page
// scroll and any css scaling of the canvas
function canvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (canvas.width / rect.width),
    y: (e.clientY - rect.top) * (canvas.height / rect.height)
  };
}

// remember where the pointer is so the 1/2/3 keys know where to aim
canvas.addEventListener('mousemove', e => {
  mouse = canvasPos(e);
});

// listen to mouse events to fire counter-missiles
canvas.addEventListener('click', e => {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (err) {}
  }

  if (state === 'ready') {
    resetGame();
    return;
  }
  if (state === 'game-over') {

    // small delay so a frantic last click doesn't instantly restart
    if (performance.now() - stateTime > 1500) {
      resetGame();
    }
    return;
  }
  if (state !== 'playing' || paused) return;

  const { x, y } = canvasPos(e);

  // determine which silo is closest to the pointer and fire a
  // counter-missile from it
  let launchSilo = null;
  let siloDistance = Infinity;  // start at the largest number
  silos.forEach(silo => {
    const dist = distance({ x, y }, silo);
    if (dist < siloDistance && silo.missiles && silo.alive) {
      siloDistance = dist;
      launchSilo = silo;
    }
  });

  fireCounterMissile(launchSilo, x, y);
});

// P pauses the game, M toggles sound, 1/2/3 fire specific silos at
// the current mouse position
document.addEventListener('keydown', e => {
  if (e.key === 'm' || e.key === 'M') {
    muted = !muted;
  }
  else if (e.key >= '1' && e.key <= '3' && state === 'playing' && !paused) {
    fireCounterMissile(silos[e.key - 1], mouse.x, mouse.y);
  }
  else if ((e.key === 'p' || e.key === 'P') && (state === 'playing' || paused)) {
    paused = !paused;

    if (paused) {
      pauseStart = performance.now();
      drawCenteredText('PAUSED', 280, 40, 'white');
    }
    else {

      // shift all timers forward so the wave doesn't jump on unpause
      const pausedFor = performance.now() - pauseStart;
      lastSpawnTime += pausedFor;
      lastBomberTime += pausedFor;
      stateTime += pausedFor;
      bombers.forEach(bomber => bomber.nextDrop += pausedFor);
    }
  }
});

// start the game
requestAnimationFrame(loop);
</script>
